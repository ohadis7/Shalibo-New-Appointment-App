name: Agent task
description: A scoped task an overnight agent session can pick up and complete on its own
title: "[task] "
labels: ["agent-ready"]
body:
  - type: markdown
    attributes:
      value: |
        A task only produces good work if it is specific. "Improve the design"
        comes back bad. "The service dropdown clips below 380px on mobile"
        comes back good.

  - type: textarea
    id: problem
    attributes:
      label: What is wrong, or what is missing
      description: Describe the current behaviour, not the solution you have in mind.
      placeholder: On iPhone SE width (375px) the booking hub cards overflow the screen edge by about 12px.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How an agent proves it is done. One checkable statement per line.
      placeholder: |
        - No horizontal scroll at 375px, 768px and 1440px
        - Cards keep a 16px gutter on both sides
        - Nothing changes at desktop width
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Booking hub (landing.html)
        - Booking wizard theme (custom.css / booking-inject.js)
        - Admin login (login-override.css / login-inject.js)
        - Build and injections (Dockerfile / verify-injections.sh)
        - Tests and CI
        - Other
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk to the live booking flow
      description: Anything touching injections, the redirect script or the provider filter is high risk.
      options:
        - Low - cosmetic, easy to revert
        - Medium - changes behaviour customers see
        - High - touches the build, injections or booking flow
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Constraints or context
      description: Anything the agent would otherwise have to guess at. Guessing is what produces bad overnight work.
    validations:
      required: false
